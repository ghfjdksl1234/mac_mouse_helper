name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and build universal app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Check release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match app version v$version"
            exit 1
          fi

      - name: Run core tests
        run: ./scripts/test.sh

      - name: Build Apple Silicon and Intel app
        env:
          UNIVERSAL: '1'
        run: ./scripts/build.sh

      - name: Package and verify download
        run: ./scripts/package.sh

      - name: Upload app and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Where-is-My-Mouse-macOS-universal
          path: |
            dist/Where-is-My-Mouse-macOS-universal.zip
            dist/Where-is-My-Mouse-macOS-universal.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Where-is-My-Mouse-macOS-universal
          path: dist

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check Where-is-My-Mouse-macOS-universal.zip.sha256
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft release.json)" != "true" ]]; then
              echo "::error::Release is already published; refusing to replace its assets."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" Where-is-My-Mouse-macOS-universal.zip* --clobber
          else
            cat > release-notes.md <<'NOTES'
          Native menu-bar utility for macOS 13 or later. The app supports Apple Silicon and Intel Macs.

          Download the app ZIP, unzip it, and move Where is My Mouse.app into Applications. Enable Input Monitoring and Accessibility from the app's General settings.

          This build is ad-hoc signed and is not Apple-notarized. macOS may block its first launch; review the source and use System Settings → Privacy & Security → Open Anyway if you trust this build.

          Review this draft and add release notes before publishing.
          NOTES
            gh release create "$RELEASE_TAG" Where-is-My-Mouse-macOS-universal.zip* \
              --verify-tag --draft --title "Where is My Mouse? $RELEASE_TAG" --notes-file release-notes.md
          fi
